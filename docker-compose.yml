      JWT_SECRET: твой_секретный_ключ
      BOT_TOKEN: 8082001071:AAGM0wpFF6L0vDh6Z91DetDhVjT81fqjri4
    volumes:
      - ./backend/internal/media:/app/media
    restart: unless-stopped

  frontend:
    build:
