<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Баннеры и медиа</title>
</head>
<body>
  <h1>🖼️ Баннеры и медиа</h1>

  <h2>Загрузить новый баннер</h2>
  <form method="POST" enctype="multipart/form-data">
    <label for="title">Название:</label><br>
    <input id="title" name="title" required><br><br>
    <label for="file">Файл (картинка, гиф):</label><br>
    <input id="file" name="file" type="file" accept="image/*,image/gif" required><br><br>
    <button type="submit">Загрузить</button>
  </form>

  {{if .Message}}<p style="color:green">{{.Message}}</p>{{end}}
  {{if .Error}}<p style="color:red">{{.Error}}</p>{{end}}

  <h2>Список баннеров</h2>
  <table border="1">
    <tr>
      <th>Превью</th>
      <th>Название</th>
      <th>Статус</th>
      <th>Действия</th>
    </tr>
    {{range .Banners}}
    <tr>
      <td><img src="{{.ImageURL}}" alt="preview" style="max-width:100px;max-height:60px;"></td>
      <td>{{.Title}}</td>
      <td>{{if .IsActive}}Активен{{else}}Неактивен{{end}}</td>
      <td>
        <form method="POST" style="display:inline">
          <input type="hidden" name="banner_id" value="{{.ID}}">
          <button name="action" value="toggle">{{if .IsActive}}Деактивировать{{else}}Активировать{{end}}</button>
        </form>
        <form method="POST" style="display:inline" onsubmit="return confirm('Удалить баннер?');">
          <input type="hidden" name="banner_id" value="{{.ID}}">
          <button name="action" value="delete">Удалить</button>
        </form>
      </td>
    </tr>
    {{else}}
    <tr><td colspan="4">Баннеров нет</td></tr>
    {{end}}
  </table>

  <p><a href="/dashboard">← Назад</a></p>
</body>
</html>
